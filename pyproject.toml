[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "py-lean-package"
version = "0.2.0"
description = "Detect and fix missing source-exclude patterns in Python projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Raphael Stolt", email = "raphael.stolt@gmail.com"},
]
dependencies = [
    "pydantic>=2.14.1",
    "tomlkit>=0.15.2",
    "typer>=0.27.3",
]

[project.scripts]
py-lean = "py_lean_package.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.uv.build-backend]
source-exclude = [
    ".github/**",
    "tests/**",
    ".gitignore",
    "all-qa-checks.py",
    "CHANGELOG.md",
    "RELEASE.md",
    "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
